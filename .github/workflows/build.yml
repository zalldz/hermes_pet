name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK (untuk sideload/uji)
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hermespet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # AAB rilis bertanda tangan — artefak siap unggah ke Play Console
      - name: Build release AAB (untuk Play Store)
        run: gradle bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mocipet-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
