name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # untuk membuat GitHub Release

# Jalankan semua JS action di Node.js 24 (Node 20 di-deprecate GitHub per Jun 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK (untuk sideload/uji)
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hermespet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # AAB rilis bertanda tangan — artefak siap unggah ke Play Console
      - name: Build release AAB (untuk Play Store)
        run: gradle bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mocipet-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # --- otomatis publish ke GitHub Releases (URL unduh langsung & stabil) ---
      - name: Baca versionName
        id: ver
        run: |
          V=$(grep -m1 versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Siapkan berkas rilis (nama jelas berversi)
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/mocipet-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/mocipet-v${{ steps.ver.outputs.version }}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mocipet v${{ steps.ver.outputs.version }}
          body: |
            Build otomatis dari commit ${{ github.sha }}.
            - **mocipet-v${{ steps.ver.outputs.version }}.apk** — pasang langsung ke HP (sideload).
            - **mocipet-v${{ steps.ver.outputs.version }}.aab** — untuk unggah ke Play Console.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
